<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 880" width="840" height="880" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="phoneGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes floatPhone {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes waveBars {
        0%, 100% { height: 18px; y: 46px; }
        50% { height: 44px; y: 20px; }
      }
      @keyframes waveBars2 {
        0%, 100% { height: 38px; y: 26px; }
        50% { height: 14px; y: 50px; }
      }
      @keyframes waveBars3 {
        0%, 100% { height: 26px; y: 38px; }
        50% { height: 50px; y: 14px; }
      }
      @keyframes toastDrop {
        0%, 15% { transform: translateY(-70px); opacity: 0; }
        22%, 78% { transform: translateY(0px); opacity: 1; }
        85%, 100% { transform: translateY(-70px); opacity: 0; }
      }
      @keyframes codeType {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes radarPulse {
        0% { r: 5px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes badgeShine {
        0% { transform: translateX(-150px); }
        50%, 100% { transform: translateX(250px); }
      }

      .floating-phone {
        animation: floatPhone 4.5s ease-in-out infinite;
        transform-origin: center;
      }
      .ambient-glow {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .bar-anim-1 { animation: waveBars 1.8s ease-in-out infinite; }
      .bar-anim-2 { animation: waveBars2 2.2s ease-in-out infinite 0.2s; }
      .bar-anim-3 { animation: waveBars3 1.9s ease-in-out infinite 0.4s; }
      .bar-anim-4 { animation: waveBars 2.4s ease-in-out infinite 0.6s; }
      .bar-anim-5 { animation: waveBars2 1.7s ease-in-out infinite 0.1s; }
      .bar-anim-6 { animation: waveBars3 2.1s ease-in-out infinite 0.5s; }
      .toast-anim { animation: toastDrop 6s ease-in-out infinite; }
      .cursor-blink { animation: codeType 1s infinite; }
      .radar-wave { animation: radarPulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="1" y="1" width="838" height="878" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2" />

  <!-- Terminal Header / Titlebar -->
  <path d="M 1 14 Q 1 1 14 1 L 826 1 Q 839 1 839 14 L 839 42 L 1 42 Z" fill="#161b22" />
  <line x1="1" y1="42" x2="839" y2="42" stroke="#30363d" stroke-width="1.5" />

  <!-- Traffic Light Dots -->
  <circle cx="28" cy="22" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="48" cy="22" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="68" cy="22" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Terminal Title -->
  <text x="420" y="27" fill="#7d8590" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="middle">
    jricardo@dev-machine: ~/mobile-preview.sh
  </text>

  <!-- Subtle Cyber Grid Background -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="42" x2="80" y2="878" />
    <line x1="200" y1="42" x2="200" y2="878" />
    <line x1="320" y1="42" x2="320" y2="878" />
    <line x1="440" y1="42" x2="440" y2="878" />
    <line x1="560" y1="42" x2="560" y2="878" />
    <line x1="680" y1="42" x2="680" y2="878" />
    <line x1="760" y1="42" x2="760" y2="878" />
    <line x1="1" y1="140" x2="839" y2="140" />
    <line x1="1" y1="260" x2="839" y2="260" />
    <line x1="1" y1="380" x2="839" y2="380" />
    <line x1="1" y1="500" x2="839" y2="500" />
    <line x1="1" y1="620" x2="839" y2="620" />
    <line x1="1" y1="740" x2="839" y2="740" />
  </g>

  <!-- Ambient Glow Behind Phone -->
  <ellipse cx="420" cy="460" rx="200" ry="340" fill="#38bdf8" opacity="0.12" filter="url(#phoneGlow)" class="ambient-glow" />
  <ellipse cx="420" cy="460" rx="140" ry="240" fill="#818cf8" opacity="0.1" filter="url(#phoneGlow)" class="ambient-glow" />

  <!-- Floating Smartphone Assembly -->
  <g class="floating-phone">

    <!-- External Shadow & Bezel Glow -->
    <rect x="236" y="76" width="368" height="738" rx="48" fill="none" stroke="url(#phoneBorder)" stroke-width="3" filter="url(#cyanGlow)" opacity="0.8" />

    <!-- Phone Chassis (Outer Body) -->
    <rect x="238" y="78" width="364" height="734" rx="46" fill="#1e2430" stroke="#334155" stroke-width="2" />

    <!-- Phone Screen Bezel -->
    <rect x="246" y="86" width="348" height="718" rx="38" fill="url(#phoneBody)" stroke="#0f172a" stroke-width="1.5" />

    <!-- SCREEN CLIP PATH -->
    <clipPath id="screenClip">
      <rect x="246" y="86" width="348" height="718" rx="38" />
    </clipPath>

    <!-- CONTENT INSIDE PHONE SCREEN -->
    <g clip-path="url(#screenClip)">

      <!-- Top Status Bar -->
      <g fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace">
        <text x="278" y="116" font-weight="700" fill="#f8fafc">09:41</text>
        <!-- 5G / Signal Bars -->
        <rect x="522" y="108" width="3" height="4" rx="0.5" fill="#f8fafc" />
        <rect x="527" y="105" width="3" height="7" rx="0.5" fill="#f8fafc" />
        <rect x="532" y="102" width="3" height="10" rx="0.5" fill="#f8fafc" />
        <rect x="537" y="99" width="3" height="13" rx="0.5" fill="#f8fafc" />
        <!-- Battery Icon -->
        <rect x="548" y="102" width="20" height="10" rx="2.5" fill="none" stroke="#f8fafc" stroke-width="1.5" />
        <rect x="550" y="104" width="13" height="6" rx="1" fill="#38bdf8" />
        <path d="M569 105 L570 105 Q571 105 571 107 L571 107 Q571 109 570 109 L569 109 Z" fill="#f8fafc" />
      </g>

      <!-- Dynamic Island (Punch-hole) -->
      <rect x="368" y="96" width="104" height="26" rx="13" fill="#000000" stroke="#1e293b" stroke-width="1" />
      <circle cx="382" cy="109" r="5" fill="#080e1a" />
      <circle cx="382" cy="109" r="2" fill="#1e3a8a" />
      <circle cx="452" cy="109" r="3.5" fill="#059669" />

      <!-- APP HEADER / PROFILE CARD -->
      <g transform="translate(266, 140)">
        <rect x="0" y="0" width="308" height="96" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

        <!-- Avatar Circle with Radar Pulse -->
        <circle cx="42" cy="48" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <circle cx="42" cy="48" r="5" fill="#38bdf8" class="radar-wave" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="42" cy="48" r="4" fill="#38bdf8" />
        <text x="42" y="53" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono', monospace">RG</text>

        <!-- Status Dot Active -->
        <circle cx="60" cy="30" r="5" fill="#22c55e" stroke="#0d1117" stroke-width="1.5" />

        <!-- User Info -->
        <text x="82" y="38" fill="#f8fafc" font-size="15" font-weight="700">Ricardo Goulart</text>
        <text x="82" y="56" fill="#38bdf8" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">Software Developer</text>
        <text x="82" y="73" fill="#94a3b8" font-size="10">@jricardogoulart · Full Stack</text>
      </g>

      <!-- FLOATING CODE TERMINAL CARD -->
      <g transform="translate(266, 252)">
        <rect x="0" y="0" width="308" height="152" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />

        <!-- Mini Code Header -->
        <rect x="0" y="0" width="308" height="28" rx="16" fill="#131b2c" />
        <circle cx="16" cy="14" r="3.5" fill="#ef4444" />
        <circle cx="28" cy="14" r="3.5" fill="#f59e0b" />
        <circle cx="40" cy="14" r="3.5" fill="#10b981" />
        <text x="154" y="18" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">terminal.ts</text>

        <!-- Syntax Code Display -->
        <g font-family="'JetBrains Mono', monospace" font-size="11" transform="translate(14, 48)">
          <text y="0">
            <tspan fill="#818cf8">const</tspan> <tspan fill="#38bdf8">profile</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#f8fafc">{</tspan>
          </text>
          <text y="19">
            <tspan fill="#94a3b8">  role:</tspan> <tspan fill="#34d399">'Full Stack Dev'</tspan><tspan fill="#94a3b8">,</tspan>
          </text>
          <text y="38">
            <tspan fill="#94a3b8">  stack:</tspan> <tspan fill="#f59e0b">['React', 'Node', 'Python']</tspan><tspan fill="#94a3b8">,</tspan>
          </text>
          <text y="57">
            <tspan fill="#94a3b8">  status:</tspan> <tspan fill="#38bdf8">'Ready to Build'</tspan>
          </text>
          <text y="76">
            <tspan fill="#f8fafc">}</tspan><tspan fill="#94a3b8">;</tspan>
          </text>
          <text y="95" fill="#38bdf8" font-weight="700">
            &gt; execute()<tspan fill="#38bdf8" class="cursor-blink">_</tspan>
          </text>
        </g>
      </g>

      <!-- LIVE ACTIVITY & MOTION CHART CARD -->
      <g transform="translate(266, 420)">
        <rect x="0" y="0" width="308" height="118" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

        <text x="16" y="26" fill="#f8fafc" font-size="12" font-weight="700">Realtime Metrics</text>
        <text x="210" y="26" fill="#34d399" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">● 99.8% UP</text>

        <!-- Animated Wave Bars -->
        <g transform="translate(24, 38)">
          <rect x="0" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-1" />
          <rect x="22" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-2" />
          <rect x="44" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-3" />
          <rect x="66" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-4" />
          <rect x="88" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-5" />
          <rect x="110" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-6" />
          <rect x="132" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-1" />
          <rect x="154" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-3" />
          <rect x="176" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-2" />
          <rect x="198" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-5" />
          <rect x="220" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-4" />
          <rect x="242" width="12" rx="4" fill="url(#chartGrad)" class="bar-anim-6" />
        </g>
      </g>

      <!-- CORE SKILLS BADGES -->
      <g transform="translate(266, 554)">
        <!-- Skill Pills -->
        <g font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">
          <rect x="0" y="0" width="68" height="26" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
          <text x="34" y="17" fill="#38bdf8" text-anchor="middle">React</text>

          <rect x="76" y="0" width="76" height="26" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
          <text x="114" y="17" fill="#818cf8" text-anchor="middle">Node.js</text>

          <rect x="160" y="0" width="70" height="26" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
          <text x="195" y="17" fill="#34d399" text-anchor="middle">Python</text>

          <rect x="238" y="0" width="70" height="26" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
          <text x="273" y="17" fill="#f59e0b" text-anchor="middle">Docker</text>

          <rect x="0" y="34" width="88" height="26" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
          <text x="44" y="51" fill="#ec4899" text-anchor="middle">PostgreSQL</text>

          <rect x="96" y="34" width="60" height="26" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1" />
          <text x="126" y="51" fill="#22d3ee" text-anchor="middle">GSAP</text>

          <rect x="164" y="34" width="72" height="26" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
          <text x="200" y="51" fill="#a855f7" text-anchor="middle">Linux</text>

          <rect x="244" y="34" width="64" height="26" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
          <text x="276" y="51" fill="#38bdf8" text-anchor="middle">Cloud</text>
        </g>
      </g>

      <!-- FLOATING TOAST NOTIFICATION (ANIMATED DROP) -->
      <g transform="translate(276, 638)" class="toast-anim">
        <rect x="0" y="0" width="288" height="46" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#cyanGlow)" />
        <circle cx="24" cy="23" r="10" fill="#0284c7" />
        <path d="M19 23 L22 26 L29 19" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="44" y="21" fill="#f8fafc" font-size="11" font-weight="700">Pipeline Status</text>
        <text x="44" y="35" fill="#38bdf8" font-size="10" font-family="'JetBrains Mono', monospace">✓ Build &amp; tests passed (100%)</text>
      </g>

      <!-- BOTTOM NAVIGATION BAR -->
      <g transform="translate(246, 730)">
        <rect x="0" y="0" width="348" height="74" fill="#090d16" stroke="#1e293b" stroke-width="1" />
        <!-- Nav Icons -->
        <!-- Code Tab (Active) -->
        <g transform="translate(58, 18)">
          <path d="M-8 0 L-16 8 L-8 16 M8 0 L16 8 L8 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
          <circle cx="0" cy="24" r="2.5" fill="#38bdf8" />
        </g>
        <!-- Git Branch Tab -->
        <g transform="translate(140, 18)" stroke="#64748b" stroke-width="2" fill="none">
          <circle cx="-4" cy="2" r="3" />
          <circle cx="-4" cy="14" r="3" />
          <circle cx="8" cy="6" r="3" />
          <path d="M-4 5 L-4 11 M-4 6 Q4 6 8 6" stroke-linecap="round" />
        </g>
        <!-- Metrics / Chart Tab -->
        <g transform="translate(216, 18)" stroke="#64748b" stroke-width="2" fill="none">
          <line x1="-8" y1="16" x2="-8" y2="4" stroke-linecap="round" />
          <line x1="0" y1="16" x2="0" y2="0" stroke-linecap="round" />
          <line x1="8" y1="16" x2="8" y2="8" stroke-linecap="round" />
        </g>
        <!-- Profile Tab -->
        <g transform="translate(290, 18)" stroke="#64748b" stroke-width="2" fill="none">
          <circle cx="0" cy="4" r="5" />
          <path d="M-8 16 Q0 10 8 16" stroke-linecap="round" />
        </g>
        <!-- Home Indicator Bar -->
        <rect x="114" y="58" width="120" height="4.5" rx="2.5" fill="#f8fafc" opacity="0.6" />
      </g>

    </g> <!-- End Screen Clip -->

  </g> <!-- End Floating Phone -->

  <!-- Terminal Status Footer -->
  <g transform="translate(30, 856)" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7d8590">
    <text x="0" y="0">
      <tspan fill="#38bdf8">●</tspan> device: iOS/Android Hybrid · fps: 60 · memory: optimal
    </text>
    <text x="780" y="0" text-anchor="end" fill="#38bdf8">v2.4.0</text>
  </g>

</svg>
